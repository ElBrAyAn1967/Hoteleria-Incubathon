name: 🐛 Reporte de bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Describe el problema y qué esperabas.
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a…
        2. Hacer clic en…
        3. Ver el error
  - type: input
    id: donde
    attributes:
      label: ¿Dónde? (local / Vercel / rama)
