name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint + Build (Next.js / bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (frontend)
        run: bun run --cwd apps/web lint || echo "lint: warnings permitidas por ahora"

      - name: Build (frontend)
        run: bun run --cwd apps/web build
